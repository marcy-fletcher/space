<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>We've moved — Marcy's Library</title>
    <meta
      name="description"
      content="Marcy's Library has moved. Visit the library at its new address, marcyfletcher.vercel.app."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="assets/brand-icon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/barlow-condensed-light.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img src="assets/brand-icon.svg" width="40" height="40" alt="" />
        <span>Marcy's <span class="brand-accent">Library</span></span>
      </div>
    </header>

    <main>
      <div class="notice">
        <h1>We've moved<span class="brand-accent">.</span></h1>
        <a class="destination" href="https://marcyfletcher.vercel.app/">
          Visit Marcy's Library
        </a>
      </div>
      <img
        class="moving-art"
        src="assets/moving-librarian-v3.webp"
        width="1120"
        height="1400"
        alt="A red-skinned devil librarian with long black hair packing ornate books into moving boxes."
        fetchpriority="high"
      />
    </main>
  </body>
</html>
