<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>We're moving — Marcy's Library</title>
    <meta
      name="description"
      content="Marcy's Library is moving to a new home. The library is packing its shelves, and we'll be back soon. Thank you for your patience."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="assets/brand-icon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/barlow-condensed-light.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img src="assets/brand-icon.svg" width="40" height="40" alt="" />
        <span>Marcy's <span class="brand-accent">Library</span></span>
      </div>
    </header>

    <main>
      <div class="notice">
        <p class="eyebrow">A new chapter</p>
        <h1>
          We're moving<br />to a new home<span class="brand-accent">.</span>
        </h1>
        <p class="description">The library is packing its shelves.</p>
        <p class="return-note">We'll be back soon.</p>
      </div>
      <img
        class="moving-art"
        src="assets/moving-librarian-v3.webp"
        width="1120"
        height="1400"
        alt="A red-skinned devil librarian with long black hair packing ornate books into moving boxes."
        fetchpriority="high"
      />
    </main>
  </body>
</html>
